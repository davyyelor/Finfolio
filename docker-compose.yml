services:

  postgres:
    image: postgres:18
    container_name: finfolio-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: finfolio
      POSTGRES_USER: finfolio
      POSTGRES_PASSWORD: finfolio_dev_password

    ports:
      - "5432:5432"

    volumes:
      - finfolio_postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finfolio -d finfolio"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  finfolio_postgres_data: