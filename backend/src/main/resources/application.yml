spring:

  application:
    name: -backend

  datasource:
    url: jdbc:postgresql://localhost:5432/finfolio
    username: finfolio
    password: finfolio_dev_password

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080